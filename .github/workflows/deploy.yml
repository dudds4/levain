name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploy only once the WASMER_TOKEN secret is configured; before that,
      # this workflow just checks that the site builds.
      - uses: wasmerio/setup-wasmer@v3.1
        if: env.WASMER_TOKEN != ''

      - name: Deploy
        if: env.WASMER_TOKEN != ''
        run: wasmer deploy --non-interactive
